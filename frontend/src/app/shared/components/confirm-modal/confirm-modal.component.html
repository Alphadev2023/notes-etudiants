<div
  *ngIf="open"
  class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4"
  (click)="cancel.emit()"
>
  <div
    class="bg-white rounded-2xl shadow-xl w-full max-w-sm p-6"
    (click)="$event.stopPropagation()"
  >
    <div class="flex items-center gap-3 mb-4">
      <div class="w-10 h-10 bg-danger-50 rounded-full flex items-center justify-center shrink-0">
        <app-icon name="alert-triangle" [size]="20" class="text-danger-600"></app-icon>
      </div>
      <h3 class="text-lg font-semibold text-neutral-900">{{ title }}</h3>
    </div>
    <p class="text-sm text-neutral-500 mb-6">{{ message }}</p>
    <div class="flex gap-3">
      <button (click)="cancel.emit()" class="btn-secondary flex-1">
        {{ cancelLabel }}
      </button>
      <button
        (click)="confirm.emit()"
        [disabled]="loading"
        class="btn-danger flex-1 flex items-center justify-center gap-2"
      >
        <app-icon *ngIf="loading" name="refresh" [size]="16" class="animate-spin"></app-icon>
        {{ confirmLabel }}
      </button>
    </div>
  </div>
</div>
